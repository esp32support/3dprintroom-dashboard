<svg viewBox="0 0 112 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Filament spool" focusable="false">
<!--
  Canonical filament-reel artwork for 3DPrintRoomMonitor - the readable
  design source only. The dashboard does NOT load this file; app.js's
  filamentSpoolSvg(colorHex, colorName) builds this exact shape inline so
  the winding colour can be set per-card from the existing
  filamentLibrary colorHex / AMS tray.color data (one colour system, no
  duplicated per-colour assets). The winding here is a neutral placeholder
  grey. A tall reel at a ~3/4 angle: a round kraft front flange low-left
  (vent slots, hub, recessed hole, 3D FILAMENT wordmark, recycle mark),
  the wound filament as a compact ridged cylinder curving over the top and
  down the right, a smaller darker rear flange up-right. Transparent
  background, all vector, dark-UI friendly.
-->
<defs>
<radialGradient id="spoolff" cx="32%" cy="26%" r="88%">
<stop offset="0" stop-color="#f6dcb6"/>
<stop offset="0.55" stop-color="#dab887"/>
<stop offset="1" stop-color="#a2783f"/>
</radialGradient>
<radialGradient id="spoolrf" cx="56%" cy="50%" r="82%">
<stop offset="0" stop-color="#8a6f47"/>
<stop offset="1" stop-color="#4f3c27"/>
</radialGradient>
<linearGradient id="spoolbs" x1="0" y1="0" x2="0.2" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
<stop offset="0.38" stop-color="#fff" stop-opacity="0"/>
<stop offset="0.66" stop-color="#000" stop-opacity="0"/>
<stop offset="1" stop-color="#000" stop-opacity="0.4"/>
</linearGradient>
</defs>

<!-- contact shadow -->
<ellipse cx="52" cy="102" rx="42" ry="7" fill="#000" opacity="0.2"/>
<ellipse cx="44" cy="102" rx="26" ry="5" fill="#000" opacity="0.22"/>

<!-- rear flange (up-right, darker) -->
<ellipse cx="77" cy="41" rx="26" ry="31" transform="rotate(-8 75 39)" fill="#000" opacity="0.18"/>
<ellipse cx="75" cy="39" rx="26" ry="31" transform="rotate(-8 75 39)" fill="url(#spoolrf)"/>
<ellipse cx="75" cy="39" rx="26" ry="31" transform="rotate(-8 75 39)" fill="none" stroke="#382b1c" stroke-width="1.4" opacity="0.85"/>

<!-- filament winding cylinder: app.js stacks ~25 tilted ellipses from the
     far cap to the near cap, each stroked so the seam reads as one turn
     of wound filament; near slices lit, far slices in shadow and slightly
     smaller. A representative subset is shown here. -->
<g stroke-width="0.7" stroke-opacity="0.5">
<ellipse cx="74" cy="40" rx="25" ry="30" transform="rotate(-8 74 40)" fill="#494c4f" stroke="#53595e"/>
<ellipse cx="66.75" cy="43.25" rx="26.25" ry="31.25" transform="rotate(-8 66.75 43.25)" fill="#64686b" stroke="#cbcfd2"/>
<ellipse cx="59.5" cy="46.5" rx="27.5" ry="32.5" transform="rotate(-8 59.5 46.5)" fill="#808487" stroke="#53595e"/>
<ellipse cx="52.25" cy="49.75" rx="28.75" ry="33.75" transform="rotate(-8 52.25 49.75)" fill="#9c9fa2" stroke="#cbcfd2"/>
<ellipse cx="45" cy="53" rx="30" ry="35" transform="rotate(-8 45 53)" fill="#b8bbbe" stroke="#53595e"/>
</g>
<ellipse cx="59.5" cy="46.5" rx="28.5" ry="33.5" transform="rotate(-8 59.5 46.5)" fill="url(#spoolbs)"/>
<ellipse cx="45" cy="53" rx="30" ry="35" transform="rotate(-8 45 53)" fill="none" stroke="#53595e" stroke-width="1.2" opacity="0.55"/>
<ellipse cx="42" cy="59" rx="30" ry="36" transform="rotate(-8 42 59)" fill="none" stroke="#000" stroke-width="3" opacity="0.14"/>

<!-- front flange -->
<g transform="rotate(-8 42 59)">
<ellipse cx="43.5" cy="60.5" rx="32.5" ry="38.5" fill="#000" opacity="0.16"/>
<ellipse cx="42" cy="59" rx="31" ry="37" fill="url(#spoolff)"/>
<ellipse cx="42" cy="59" rx="31" ry="37" fill="none" stroke="#785937" stroke-width="1.7" opacity="0.85"/>
<ellipse cx="42" cy="59" rx="28.5" ry="34.5" fill="none" stroke="#f4dcbb" stroke-width="1" opacity="0.26"/>
<!-- six radial vent slots -->
<g transform="rotate(12 45.43 40.42)"><rect x="43.43" y="34.82" width="4" height="11.2" rx="2" fill="#5f5a52"/><rect x="43.43" y="34.82" width="4" height="11.2" rx="2" fill="none" stroke="#3c382f" stroke-width="0.5"/><rect x="44.33" y="35.82" width="1.2" height="9.2" rx="0.6" fill="#8f887c" opacity="0.55"/></g>
<g transform="rotate(72 57.69 53.13)"><rect x="55.69" y="47.53" width="4" height="11.2" rx="2" fill="#5f5a52"/><rect x="55.69" y="47.53" width="4" height="11.2" rx="2" fill="none" stroke="#3c382f" stroke-width="0.5"/><rect x="56.59" y="48.53" width="1.2" height="9.2" rx="0.6" fill="#8f887c" opacity="0.55"/></g>
<g transform="rotate(132 54.26 71.71)"><rect x="52.26" y="66.11" width="4" height="11.2" rx="2" fill="#5f5a52"/><rect x="52.26" y="66.11" width="4" height="11.2" rx="2" fill="none" stroke="#3c382f" stroke-width="0.5"/><rect x="53.16" y="67.11" width="1.2" height="9.2" rx="0.6" fill="#8f887c" opacity="0.55"/></g>
<g transform="rotate(192 38.57 77.58)"><rect x="36.57" y="71.98" width="4" height="11.2" rx="2" fill="#5f5a52"/><rect x="36.57" y="71.98" width="4" height="11.2" rx="2" fill="none" stroke="#3c382f" stroke-width="0.5"/><rect x="37.47" y="72.98" width="1.2" height="9.2" rx="0.6" fill="#8f887c" opacity="0.55"/></g>
<g transform="rotate(252 26.31 64.87)"><rect x="24.31" y="59.27" width="4" height="11.2" rx="2" fill="#5f5a52"/><rect x="24.31" y="59.27" width="4" height="11.2" rx="2" fill="none" stroke="#3c382f" stroke-width="0.5"/><rect x="25.21" y="60.27" width="1.2" height="9.2" rx="0.6" fill="#8f887c" opacity="0.55"/></g>
<g transform="rotate(312 29.74 46.29)"><rect x="27.74" y="40.69" width="4" height="11.2" rx="2" fill="#5f5a52"/><rect x="27.74" y="40.69" width="4" height="11.2" rx="2" fill="none" stroke="#3c382f" stroke-width="0.5"/><rect x="28.64" y="41.69" width="1.2" height="9.2" rx="0.6" fill="#8f887c" opacity="0.55"/></g>
<text x="42" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="6.6" fill="#785937" opacity="0.9">3D</text>
<text x="42" y="42.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="3.4" letter-spacing="0.4" fill="#785937" opacity="0.7">FILAMENT</text>
<path d="M42 73 l4.2 7.2 -8.4 0 z" fill="none" stroke="#785937" stroke-width="1.3" stroke-linejoin="round" opacity="0.45"/>
<ellipse cx="42" cy="59" rx="11" ry="13" fill="#cda67a"/>
<ellipse cx="42" cy="59" rx="11" ry="13" fill="none" stroke="#785937" stroke-width="1.4"/>
<ellipse cx="42" cy="59" rx="5.5" ry="7.5" fill="#180f08"/>
<ellipse cx="42" cy="59" rx="5.5" ry="7.5" fill="none" stroke="#0a0603" stroke-width="1"/>
<path d="M38.6 55.2 A5.5 7.5 0 0 1 44.2 52.8" fill="none" stroke="#fff" stroke-width="1" opacity="0.12" stroke-linecap="round"/>
</g>

<!-- top-left rim highlight -->
<path d="M23 40 A31 37 -8 0 1 46 24" fill="none" stroke="#fff" stroke-width="1.8" opacity="0.32" stroke-linecap="round"/>
</svg>
