<svg viewBox="12 12 112 78" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Filament spool" focusable="false">
<!--
  Canonical filament-reel artwork for 3DPrintRoomMonitor - the readable
  design source only. The dashboard does NOT load this file; app.js's
  filamentSpoolSvg(colorHex, colorName) builds this exact shape inline so
  the winding colour can be set per-card from the existing
  filamentLibrary colorHex / AMS tray.color data (one colour system, no
  duplicated per-colour assets). The winding here is a neutral placeholder
  grey. A deep 1 kg reel at a 3/4 angle: kraft front flange (vent slots,
  hub, recessed hole, 3D FILAMENT wordmark, recycle mark) at the left, a
  wide ridged filament cylinder running right, darker rear flange capping
  the far end. Transparent background, all vector, dark-UI friendly.
-->
<defs>
<radialGradient id="spoolff" cx="32%" cy="26%" r="88%">
<stop offset="0" stop-color="#f6dcb6"/>
<stop offset="0.55" stop-color="#dab887"/>
<stop offset="1" stop-color="#a2783f"/>
</radialGradient>
<radialGradient id="spoolrf" cx="58%" cy="52%" r="82%">
<stop offset="0" stop-color="#977a52"/>
<stop offset="1" stop-color="#5a462d"/>
</radialGradient>
<linearGradient id="spoolbs" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
<stop offset="0.34" stop-color="#fff" stop-opacity="0"/>
<stop offset="0.66" stop-color="#000" stop-opacity="0"/>
<stop offset="1" stop-color="#000" stop-opacity="0.4"/>
</linearGradient>
</defs>

<!-- contact shadow -->
<ellipse cx="66" cy="90" rx="52" ry="7" fill="#000" opacity="0.18"/>
<ellipse cx="54" cy="90" rx="30" ry="5" fill="#000" opacity="0.22"/>

<!-- rear flange (far end) -->
<ellipse cx="98" cy="48" rx="18" ry="28" transform="rotate(-6 96 46)" fill="#000" opacity="0.2"/>
<ellipse cx="96" cy="46" rx="18" ry="28" transform="rotate(-6 96 46)" fill="url(#spoolrf)"/>
<ellipse cx="96" cy="46" rx="18" ry="28" transform="rotate(-6 96 46)" fill="none" stroke="#3f301f" stroke-width="1.4" opacity="0.85"/>
<ellipse cx="96" cy="46" rx="6" ry="9" transform="rotate(-6 96 46)" fill="#241b10"/>

<!-- filament winding cylinder: app.js stacks ~40 tall ellipses from the
     far cap to the near cap, each stroked so the seam reads as one turn
     of wound filament; near slices are lit, far slices in shadow. A
     representative subset is shown here. -->
<g fill="#7f8285">
<ellipse cx="92" cy="46" rx="17" ry="27" transform="rotate(-6 92 46)" fill="#4a4d50" stroke="#53595e" stroke-width="0.55" stroke-opacity="0.4"/>
<ellipse cx="84" cy="47" rx="17.5" ry="27.6" transform="rotate(-6 84 47)" fill="#5a5d60" stroke="#cbcfd2" stroke-width="0.55" stroke-opacity="0.4"/>
<ellipse cx="76" cy="48" rx="18" ry="28.3" transform="rotate(-6 76 48)" fill="#6a6d70" stroke="#53595e" stroke-width="0.55" stroke-opacity="0.4"/>
<ellipse cx="68.5" cy="49" rx="18.5" ry="29" transform="rotate(-6 68.5 49)" fill="#7f8285" stroke="#cbcfd2" stroke-width="0.55" stroke-opacity="0.4"/>
<ellipse cx="60" cy="50" rx="19" ry="29.7" transform="rotate(-6 60 50)" fill="#919497" stroke="#53595e" stroke-width="0.55" stroke-opacity="0.4"/>
<ellipse cx="52" cy="51" rx="19.6" ry="30.4" transform="rotate(-6 52 51)" fill="#a3a7aa" stroke="#cbcfd2" stroke-width="0.55" stroke-opacity="0.4"/>
<ellipse cx="45" cy="52" rx="20" ry="31" transform="rotate(-6 45 52)" fill="#b3b7ba" stroke="#53595e" stroke-width="0.55" stroke-opacity="0.4"/>
</g>
<ellipse cx="68.5" cy="49" rx="19.5" ry="30" transform="rotate(-6 68.5 49)" fill="url(#spoolbs)"/>
<ellipse cx="45" cy="52" rx="20" ry="31" transform="rotate(-6 45 52)" fill="none" stroke="#53595e" stroke-width="1.1" opacity="0.5"/>

<!-- front flange -->
<g transform="rotate(-6 40 52)">
<ellipse cx="41.5" cy="53" rx="23.5" ry="35.5" fill="#000" opacity="0.16"/>
<ellipse cx="40" cy="52" rx="22" ry="34" fill="url(#spoolff)"/>
<ellipse cx="40" cy="52" rx="22" ry="34" fill="none" stroke="#785937" stroke-width="1.6" opacity="0.85"/>
<ellipse cx="40" cy="52" rx="20" ry="32" fill="none" stroke="#f4dcbb" stroke-width="1" opacity="0.26"/>
<!-- six radial vent slots -->
<g transform="rotate(12 42.49 32.44)"><rect x="40.49" y="26.84" width="4" height="11.2" rx="2" fill="#5f5a52"/><rect x="40.49" y="26.84" width="4" height="11.2" rx="2" fill="none" stroke="#3c382f" stroke-width="0.5"/><rect x="41.39" y="27.84" width="1.2" height="9.2" rx="0.6" fill="#8f887c" opacity="0.55"/></g>
<g transform="rotate(72 51.41 45.82)"><rect x="49.41" y="40.22" width="4" height="11.2" rx="2" fill="#5f5a52"/><rect x="49.41" y="40.22" width="4" height="11.2" rx="2" fill="none" stroke="#3c382f" stroke-width="0.5"/><rect x="50.31" y="41.22" width="1.2" height="9.2" rx="0.6" fill="#8f887c" opacity="0.55"/></g>
<g transform="rotate(132 48.92 65.38)"><rect x="46.92" y="59.78" width="4" height="11.2" rx="2" fill="#5f5a52"/><rect x="46.92" y="59.78" width="4" height="11.2" rx="2" fill="none" stroke="#3c382f" stroke-width="0.5"/><rect x="47.82" y="60.78" width="1.2" height="9.2" rx="0.6" fill="#8f887c" opacity="0.55"/></g>
<g transform="rotate(192 37.51 71.56)"><rect x="35.51" y="65.96" width="4" height="11.2" rx="2" fill="#5f5a52"/><rect x="35.51" y="65.96" width="4" height="11.2" rx="2" fill="none" stroke="#3c382f" stroke-width="0.5"/><rect x="36.41" y="66.96" width="1.2" height="9.2" rx="0.6" fill="#8f887c" opacity="0.55"/></g>
<g transform="rotate(252 28.59 58.18)"><rect x="26.59" y="52.58" width="4" height="11.2" rx="2" fill="#5f5a52"/><rect x="26.59" y="52.58" width="4" height="11.2" rx="2" fill="none" stroke="#3c382f" stroke-width="0.5"/><rect x="27.49" y="53.58" width="1.2" height="9.2" rx="0.6" fill="#8f887c" opacity="0.55"/></g>
<g transform="rotate(312 31.08 38.62)"><rect x="29.08" y="33.02" width="4" height="11.2" rx="2" fill="#5f5a52"/><rect x="29.08" y="33.02" width="4" height="11.2" rx="2" fill="none" stroke="#3c382f" stroke-width="0.5"/><rect x="29.98" y="34.02" width="1.2" height="9.2" rx="0.6" fill="#8f887c" opacity="0.55"/></g>
<text x="40" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="6" fill="#785937" opacity="0.9">3D</text>
<text x="40" y="35.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="3.1" letter-spacing="0.3" fill="#785937" opacity="0.68">FILAMENT</text>
<path d="M40 66 l3.6 6.4 -7.2 0 z" fill="none" stroke="#785937" stroke-width="1.2" stroke-linejoin="round" opacity="0.45"/>
<ellipse cx="40" cy="52" rx="9.5" ry="12" fill="#cda67a"/>
<ellipse cx="40" cy="52" rx="9.5" ry="12" fill="none" stroke="#785937" stroke-width="1.3"/>
<ellipse cx="40" cy="52" rx="4.8" ry="6.6" fill="#180f08"/>
<ellipse cx="40" cy="52" rx="4.8" ry="6.6" fill="none" stroke="#0a0603" stroke-width="1"/>
<path d="M37 48.6 A4.8 6.6 0 0 1 41.9 46.4" fill="none" stroke="#fff" stroke-width="1" opacity="0.12" stroke-linecap="round"/>
</g>

<!-- top rim highlight -->
<path d="M23 32 A22 34 -6 0 1 46 20" fill="none" stroke="#fff" stroke-width="1.7" opacity="0.3" stroke-linecap="round"/>
</svg>
