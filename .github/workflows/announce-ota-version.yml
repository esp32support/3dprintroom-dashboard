name: Announce CYD OTA version
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Firmware version string to announce (must match Config::VERSION exactly, e.g. 1.2.34)"
        required: true
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install paho-mqtt
      - run: python scripts/announce_ota_version.py "${{ github.event.inputs.version }}"
        env:
          HIVEMQ_USER: ${{ secrets.HIVEMQ_USER }}
          HIVEMQ_PASS: ${{ secrets.HIVEMQ_PASS }}
