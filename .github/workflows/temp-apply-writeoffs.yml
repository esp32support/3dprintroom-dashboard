name: TEMP apply write-offs at quota reset

# One-shot: fires at 00:00 UTC (the exact moment the KV daily put-quota
# resets) to apply the two permanent write-offs from scripts/apply_writeoffs.py.
# Also runnable by hand (workflow_dispatch) for testing before then.
# Deleted, along with the script, once confirmed applied.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/apply_writeoffs.py
        env:
          FILAMENT_SYNC_SECRET: ${{ secrets.FILAMENT_SYNC_SECRET }}
